<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource</title> 
    <link rel="icon" href="./img/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<body class="page">
    <header>
        <div class="wrapper header">
        <a href="./index.html">
            <img src="./img/logo-light.png" alt="resource coffee house" class="logo-img_light">
            <img src="./img/logo-dark.png" alt="resource coffee house" class="logo-img_dark">
        </a>
        <nav class="header_nav">
            <ul class="header_list">
                <li class="header_item">
                    <a href="#coffee" class="link">Favorite coffee</a>
                </li>
                <li class="header_item">
                    <a href="#about" class="link">About</a>
                </li>
                <li class="header_item">
                    <a href="#app" class="link">Mobile app</a>
                </li>
                <li class="header_item">
                    <a href="#contact" class="link">Contact us</a>
                </li>
            </ul>
            <div class="menu_nav_cup">
                <img src="./img/coffee-menu.png" class="nav-cup-light" alt="coffee cup decor">
                <img src="./img/coffee-menu-1.png" class="nav-cup-dark" alt="coffee cup decor">
            </div>
        </nav>
            <div class="button_header">
                <div class="change_dark">
                    <div class="theme-icon-container">
                        <img src="./img/Light.png" alt="active sun" class="sun-active">
                        <img src="./img/Light-sun.png" alt="inactive sun" class="sun-inactive">
                    </div>
                    <div class="theme-icon-container">
                        <img src="./img/Dark-1.png" alt="inactive moon" class="moon-inactive">
                        <img src="./img/Dark.png" alt="active moon" class="moon-active">
                    </div>
                </div>
                <button class="menu_button">
                    <img src="./img/coffee-menu.png" class="light-arrow cup-light" alt="menu">
                    <img src="./img/coffee-menu-1.png" class="dark-arrow cup-dark" alt="menu">
                    
                    <img src="./img/button-icon-burger.png" class="burger icon-burger burger-light" alt="menu">
                    <img src="./img/State=default2.png" class="burger icon-burger burger-dark" alt="menu">
                    
                    <img src="./img/close_burger_lihgt.png" class="burger close-light" alt="close menu">
                    <img src="./img/close_burger_dark.png" class="burger close-dark" alt="close menu">
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="title_catalog">
            <h1 class="catalog-title">Behind each of our <br class="show_in_tablet">cups <br class="show_in_pk">hides an <span class="favorite">amazing surprise</span></h1>
            <div class="slider_catalog">
                <button class="coffee_tea_dessert active" data-category="coffee">
                    <img src="./img/icon.png" alt="coffee">
                    <h2 class="p_h2_dark">Coffee</h2>
                </button>

                <button class="coffee_tea_dessert" data-category="tea">
                    <img src="./img/icon-1.png" alt="tea">
                    <p class="p_dark">Tea</p>
                </button>
    
                <button class="coffee_tea_dessert" data-category="dessert">
                    <img src="./img/icon-3.png" alt="dessert">
                    <p class="p_dark">Dessert</p>
                </button>
            </div>
        </section>

        <section class="menu_products_grid" id="products-container">
            
        </section> 

        <button class="show_more_btn" id="load-more-btn" style="display: none;">
            <img src="./img/show_more.png" alt="show more">
        </button>
    </main>

        <footer class="wrapper footer" id="contact">
            <div class="foot_left">
                <h2 class="h2_light">Sip, Savor, Smile.</h2>
                <h2 class="h2_dark">It’s coffee time!</h2>
                <div class="social_media">
                    <a href="https://x.com/">
                        <img src="./img/button-icon-light.png" alt="twitter">
                    </a>
                    <a href="https://www.instagram.com/">
                        <img src="./img/button-icon-light-1.png" alt="instagram">
                    </a>
                    <a href="https://www.facebook.com/">
                        <img src="./img/button-icon-light-2.png" alt="facebook">
                    </a>
                </div>
                </div>
            <div class="foot_right">
                <h3 class="h3_light">Contact us</h3>
                <div class="contact_item">
                    <img src="./img/pin-alt.png" alt="location">
                    <p>8558 Green Rd.,  LA</p>
                </div>
                <div class="contact_item">
                    <img src="./img/phone.png" alt="phone">
                    <p>+1 (603) 555-0123</p>
                </div>
                <div class="contact_item">
                    <img src="./img/clock.png" alt="working time">
                    <p class="p_foot">Mon–Sat: 9:00–23:00</p>
                </div>
            </div>
        </footer>
</body>
</html>
